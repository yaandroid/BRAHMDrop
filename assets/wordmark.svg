<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="20" y1="30" x2="230" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="drop" x1="125" y1="70" x2="125" y2="215" gradientUnits="userSpaceOnUse">
