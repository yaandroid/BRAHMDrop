    </linearGradient>
    <linearGradient id="arrow" x1="125" y1="120" x2="125" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="word" x1="300" y1="80" x2="860" y2="200" gradientUnits="userSpaceOnUse">
