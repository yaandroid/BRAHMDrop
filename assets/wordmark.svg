  </g>

  <!-- wordmark -->
  <text x="268" y="150" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="92" fill="#1E293B" letter-spacing="1">BRAHM</text>
  <text x="268" y="150" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="92" fill="url(#word)" letter-spacing="1" opacity="0"></text>
  <text x="268" y="222" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="76" fill="url(#word)" letter-spacing="1">Drop</text>
  <text x="520" y="222" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="26" fill="#64748B" letter-spacing="3">FILE  TRANSFER</text>
