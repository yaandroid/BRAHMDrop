<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="drop" x1="256" y1="120" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F7FF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="256" y1="180" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1030" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- subtle signal arcs (beam) behind the drop -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M150 196 A150 150 0 0 1 362 196"/>
    <path d="M186 160 A200 200 0 0 1 326 160"/>
  </g>
  <circle cx="256" cy="150" r="13" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- water drop -->
  <path filter="url(#soft)" fill="url(#drop)" d="M256 150
      C 300 214, 356 268, 356 328
      a 100 100 0 1 1 -200 0
      C 156 268, 212 214, 256 150 Z"/>

  <!-- two-way transfer arrows inside the drop (send up / receive down) -->
  <g fill="url(#arrow)">
    <!-- up arrow (send) -->
    <path d="M232 322 l24 -34 24 34 h-16 v34 h-16 v-34 Z" transform="translate(-28,0)"/>
    <!-- down arrow (receive) -->
    <path d="M232 294 h16 v34 h16 l-24 34 -24 -34 h16 Z" transform="translate(28,0)"/>
  </g>
</svg>
